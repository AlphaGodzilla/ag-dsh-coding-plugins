name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes a user-level .npmrc with the registry token, so pnpm
          # publish authenticates through NODE_AUTH_TOKEN below.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On every main push: open/update the "Version Packages" PR when
      # changesets are pending, or publish changed packages to npm when the
      # version PR is merged. Requires the NPM_TOKEN repository secret.
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm run version:packages
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Tag every package at the release commit as "<dir>/v<version>"
      # (e.g. web-notify/v1.0.0). The changesets default git tags are disabled
      # in .changeset/config.json (gitTag: false) so tagging stays under this
      # step's control with a consistent format. Idempotent: existing tags are
      # skipped, so re-running the workflow never duplicates or moves a tag.
      - name: Tag released packages
        run: |
          for pkg in packages/*/package.json; do
            dir=$(basename "$(dirname "$pkg")")
            version=$(node -p "require('./$pkg').version")
            tag="$dir/v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
              echo "skip (exists): $tag"
            else
              git tag "$tag"
              echo "created: $tag"
            fi
          done
          git push origin --tags
