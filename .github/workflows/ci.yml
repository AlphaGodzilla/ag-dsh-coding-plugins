name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all gates
        run: pnpm check:ci

      # Require changesets only for ordinary feature PRs. The changesets
      # "Version Packages" PR (branch changeset-release/<base>) consumes
      # changesets and bumps versions, so it never carries a new one.
      - name: Require changeset for package changes (PRs)
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm exec changeset status --since=origin/main
